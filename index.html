<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple EHR on Azure</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#eef4f8;color:#203447}
main{max-width:900px;margin:auto;padding:28px;background:#fff;border-radius:12px;box-shadow:0 4px 18px #00000012}
h1{margin-top:0;color:#146b83}
.version{display:inline-block;padding:3px 10px;background:#e7f2f6;border-radius:12px;font-size:14px;font-weight:bold}
label{display:block;margin-top:16px;font-weight:bold}
input,textarea{width:100%;margin-top:7px;padding:11px;border:1px solid #aab8c2;border-radius:6px;font:inherit}
button{margin-top:18px;padding:12px 20px;border:none;border-radius:6px;background:#146b83;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#0e5063}
button.del{margin:0;padding:6px 12px;background:#b3261e}
#message{min-height:24px;font-weight:bold}
.ok{color:#146b83}.err{color:#b3261e}
.table-container{overflow-x:auto}
table{width:100%;margin-top:16px;border-collapse:collapse}
th,td{padding:12px;border:1px solid #ccd7df;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}
th{background:#e7f2f6}
footer{margin-top:24px;font-size:14px;color:#526575}
</style>
</head>
<body>
<main>
<h1>Electronic Health Record</h1>
<p><span class="version">EHR Version 2</span></p>
<p>Educational demo. Use fictional patient information only.</p>

<h2>Patient Entry Form</h2>
<form id="patientForm" novalidate>
<label for="patientId">Patient ID (letters, digits, hyphen; no spaces)</label>
<input id="patientId" placeholder="Example: P001" maxlength="30">
<label for="patientName">Patient Name</label>
<input id="patientName" placeholder="Example: Anne-Marie O'Connor" maxlength="100">
<label for="age">Age in years (whole number 0-120)</label>
<input id="age" inputmode="numeric" placeholder="Example: 25">
<label for="notes">Clinical Notes</label>
<textarea id="notes" rows="3" maxlength="500" placeholder="Enter sample clinical notes"></textarea>
<button type="submit">Add Patient Record</button>
</form>
<p id="message" role="status"></p>

<h2>Patient Records</h2>
<label for="search">Search by patient ID or name</label>
<input id="search" placeholder="Type to filter">
<p id="counts"></p>
<div class="table-container">
<table>
<thead><tr><th>Patient ID</th><th>Name</th><th>Age</th><th>Clinical Notes</th><th>Action</th></tr></thead>
<tbody id="records"></tbody>
</table>
</div>
<footer>Educational EHR demonstration | Microsoft Azure | Records are stored only in this browser (localStorage).</footer>
</main>

<script>
const KEY = "ehr-records-v1";
const form = document.getElementById("patientForm");
const tbody = document.getElementById("records");
const message = document.getElementById("message");
const search = document.getElementById("search");
const counts = document.getElementById("counts");
let patients = load();

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
  catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(patients)); } catch (e) {}
}
function newUid() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(16).slice(2);
}
function show(text, ok) {
  message.textContent = text;
  message.className = ok ? "ok" : "err";
}
const normId = s => s.trim().toUpperCase();   // P001 = p001

function render() {
  const q = search.value.trim().toLowerCase();
  const shown = patients.filter(p =>
    !q || p.pid.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  tbody.textContent = "";
  shown.forEach(p => {
    const row = document.createElement("tr");
    [p.pid, p.name, String(p.age), p.notes].forEach(v => {
      const td = document.createElement("td");
      td.textContent = v;                       // plain text, never innerHTML
      row.appendChild(td);
    });
    const td = document.createElement("td");
    const b = document.createElement("button");
    b.type = "button"; b.className = "del"; b.textContent = "Delete";
    b.addEventListener("click", () => removeRecord(p.uid));   // delete by unique id, not row position
    td.appendChild(b); row.appendChild(td);
    tbody.appendChild(row);
  });
  counts.textContent = "Total records: " + patients.length +
    " | Matching search: " + shown.length;
}

function removeRecord(uid) {
  const p = patients.find(x => x.uid === uid);
  if (!p || !confirm("Delete record " + p.pid + " (" + p.name + ")?")) return;
  patients = patients.filter(x => x.uid !== uid);
  save(); render(); show("Record deleted.", true);
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  const pid = normId(document.getElementById("patientId").value);
  const name = document.getElementById("patientName").value.trim().replace(/\s+/g, " ");
  const ageText = document.getElementById("age").value.trim();
  const notes = document.getElementById("notes").value.trim();

  if (!pid) return show("Patient ID is required.", false);
  if (!/^[A-Z0-9-]{1,30}$/.test(pid)) return show("Patient ID may contain only letters, digits and hyphens (no spaces).", false);
  if (patients.some(p => p.pid === pid)) return show("Patient ID " + pid + " already exists. Duplicate rejected.", false);
  if (!name) return show("Patient name is required.", false);
  if (name.length < 2 || !/^\p{L}[\p{L}\p{M} '’.-]*$/u.test(name)) return show("Name must be at least 2 characters: letters, spaces, hyphens, apostrophes or periods.", false);
  if (!ageText) return show("Age is required.", false);
  if (!/^\d{1,3}$/.test(ageText)) return show("Age must be a whole number (no decimals or negatives).", false);
  const age = Number(ageText);
  if (age < 0 || age > 120) return show("Age must be between 0 and 120.", false);
  if (!notes) return show("Clinical notes are required.", false);
  if (notes.length > 500) return show("Clinical notes must be 500 characters or fewer.", false);

  patients.push({ uid: newUid(), pid, name, age, notes });
  save(); render();
  show("Patient record added successfully.", true);
  form.reset();
  document.getElementById("patientId").focus();
});

search.addEventListener("input", render);
render();
</script>
</body>
</html>
